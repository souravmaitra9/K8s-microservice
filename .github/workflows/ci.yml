name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check services tests
          ruff format --check services tests
      - name: Test
        run: pytest

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install helm and kubeconform
        run: |
          curl -fsSL -o helm.tgz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL -o kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kc.tgz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
      - name: Lint and render
        run: |
          helm lint deploy/helm/agent-platform
          helm template agent-platform deploy/helm/agent-platform --namespace agent-platform \
            | kubeconform -strict -summary -kubernetes-version 1.31.0
          helm template agent-platform deploy/helm/agent-platform --namespace agent-platform \
            -f deploy/helm/agent-platform/values-kind.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.31.0
          helm template agent-platform deploy/helm/agent-platform --namespace agent-platform \
            --set serviceMonitor.enabled=true --set prometheusRule.enabled=true \
            | kubeconform -summary -ignore-missing-schemas -kubernetes-version 1.31.0

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install terraform and tflint
        run: |
          curl -fsSL -o tf.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          sudo unzip -o tf.zip -d /usr/local/bin
          curl -fsSL -o tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.54.0/tflint_linux_amd64.zip
          sudo unzip -o tflint.zip -d /usr/local/bin
      - name: Format, validate, and lint
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform/envs/example init -backend=false -input=false
          terraform -chdir=terraform/envs/example validate
          terraform -chdir=terraform/envs/aks-example init -backend=false -input=false
          terraform -chdir=terraform/envs/aks-example validate
          tflint --init
          tflint --chdir terraform/modules/eks
          tflint --chdir terraform/envs/example
          tflint --chdir terraform/modules/aks
          tflint --chdir terraform/envs/aks-example
      - name: Install trivy
        run: |
          curl -fsSL -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          tar -xzf trivy.tgz trivy
          sudo mv trivy /usr/local/bin/trivy
      - name: Scan Terraform and manifests
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install trivy
        run: |
          curl -fsSL -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          tar -xzf trivy.tgz trivy
          sudo mv trivy /usr/local/bin/trivy
      - name: Build
        run: |
          docker build -t agent-platform/guardrail:ci services/guardrail
          docker build -t agent-platform/agent:ci services/agent
          docker build -t agent-platform/kb:ci services/kb
          docker build -t agent-platform/tickets:ci services/tickets
      - name: Scan images
        run: |
          for image in guardrail agent kb tickets; do
            trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              "agent-platform/${image}:ci"
          done

  publish:
    needs: [test, helm, terraform, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check registry credentials
        id: creds
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -n "$REGISTRY_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "REGISTRY_PASSWORD is not set; skipping publish"
          fi
      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: |
          docker build -t agent-platform/guardrail:ci services/guardrail
          docker build -t agent-platform/agent:ci services/agent
          docker build -t agent-platform/kb:ci services/kb
          docker build -t agent-platform/tickets:ci services/tickets
      - name: Push
        if: steps.creds.outputs.present == 'true'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          user="${REGISTRY_USERNAME:-$GITHUB_ACTOR}"
          echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$user" --password-stdin
          for image in guardrail agent kb tickets; do
            docker tag "agent-platform/${image}:ci" "ghcr.io/${GITHUB_REPOSITORY_OWNER}/agent-platform-${image}:${GITHUB_SHA}"
            docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/agent-platform-${image}:${GITHUB_SHA}"
          done
