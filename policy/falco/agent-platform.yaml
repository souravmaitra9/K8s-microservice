# These rules use event fields directly so the file can be reviewed without
# the default Falco rule pack. The macro matches the namespace created by
# deploy/manifests/namespace.yaml. Change it if the chart is installed elsewhere.

- macro: agent_platform
  condition: (k8s.ns.name = "agent-platform")

- macro: agent_exec
  condition: (evt.type in (execve, execveat) and evt.dir = "<")

- list: agent_shells
  items: [bash, sh, zsh, dash, ash, csh, ksh, fish]

- list: agent_transfer_tools
  items: [curl, wget, nc, ncat, socat, pip, pip3]

- rule: Agent platform shell spawned
  desc: >
    A container in the agent platform spawned a shell. The services are
    Python and have no reason to exec a shell.
  condition: agent_platform and agent_exec and proc.name in (agent_shells)
  output: >
    shell spawned in agent platform
    (proc=%proc.name cmdline=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name user=%user.name)
  priority: CRITICAL
  tags: [agent_platform, process]

- rule: Agent platform package or transfer tool
  desc: >
    pip, curl, wget, or netcat executed inside an agent platform container.
  condition: agent_platform and agent_exec and proc.name in (agent_transfer_tools)
  output: >
    transfer tool spawned
    (proc=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: CRITICAL
  tags: [agent_platform, process]

- rule: Agent platform metadata service contact
  desc: >
    Outbound connection to the cloud instance metadata address. The tools
    do not take URLs; this is the SSRF and credential-theft path.
  condition: >
    agent_platform and evt.type = connect and evt.dir = "<" and
    fd.sip = "169.254.169.254"
  output: >
    metadata service contact
    (proc=%proc.cmdline pod=%k8s.pod.name dest=%fd.sip)
  priority: CRITICAL
  tags: [agent_platform, network]

- rule: Agent platform unexpected egress process
  desc: >
    A process other than the Python runtime opened an outbound connection.
  condition: >
    agent_platform and evt.type = connect and evt.dir = "<" and
    not proc.name in (python, python3, python3.12)
  output: >
    unexpected egress process
    (proc=%proc.name cmdline=%proc.cmdline dest=%fd.sip pod=%k8s.pod.name)
  priority: WARNING
  tags: [agent_platform, network]
