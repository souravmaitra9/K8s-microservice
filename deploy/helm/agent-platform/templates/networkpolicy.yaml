{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" (dict "root" . "name" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" (dict "root" . "name" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-guardrail
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" (dict "root" . "name" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: guardrail
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.ingressNamespaceLabel | quote }}: "true"
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" (dict "root" . "name" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: guardrail
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: guardrail
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kb
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tickets
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
    {{- range .Values.llm.egressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.llm.egressPort }}
    {{- end }}
    {{- if and .Values.llm.egressNamespaceLabel .Values.llm.egressNamespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{ .Values.llm.egressNamespaceLabel | quote }}: {{ .Values.llm.egressNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.llm.egressPort }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-tools
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" (dict "root" . "name" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - kb
          - tickets
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" (dict "root" . "name" "netpol") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.metricsNamespaceLabel | quote }}: "true"
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
