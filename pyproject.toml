[tool.pytest.ini_options]
testpaths = ["services", "tests"]
addopts = "-q --import-mode=importlib"
pythonpath = [
  "services/guardrail/src",
  "services/agent/src",
  "services/kb/src",
  "services/tickets/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
